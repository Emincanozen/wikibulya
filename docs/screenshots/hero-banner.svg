<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="10%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glowTopRight)"/>
  <rect width="1200" height="340" rx="16" fill="url(#glowBottomLeft)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Grid Decoration -->
  <path d="M0 68 H1200 M0 136 H1200 M0 204 H1200 M0 272 H1200" stroke="#334155" stroke-width="1" stroke-opacity="0.15"/>
  <path d="M150 0 V340 M300 0 V340 M450 0 V340 M600 0 V340 M750 0 V340 M900 0 V340 M1050 0 V340" stroke="#334155" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Decorative Redacted Blocks Graphic -->
  <g opacity="0.15" fill="#34d399">
    <rect x="940" y="80" width="120" height="24" rx="4"/>
    <rect x="1070" y="80" width="70" height="24" rx="4"/>
    <rect x="940" y="115" width="80" height="24" rx="4"/>
    <rect x="1030" y="115" width="110" height="24" rx="4"/>
    <rect x="940" y="150" width="140" height="24" rx="4"/>
    <rect x="1090" y="150" width="50" height="24" rx="4"/>
    <rect x="940" y="185" width="90" height="24" rx="4"/>
    <rect x="1040" y="185" width="100" height="24" rx="4"/>
  </g>

  <!-- Super Title / Tag -->
  <g transform="translate(80, 52)">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#10b981"/>
    <text x="30" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">WORD DEDUCTION GAME</text>
  </g>

  <!-- Title -->
  <text x="80" y="145" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">WikiBulYa</text>
  <text x="350" y="145" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">🎯</text>

  <!-- Tagline -->
  <text x="80" y="190" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">Interactive Wikipedia Word Deduction Game • Redacted Text Unmasking • Cross-Platform</text>

  <!-- 4 Tech Pills -->
  <g transform="translate(80, 235)" filter="url(#badgeShadow)">
    <rect width="180" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">🟢 Node 22 &amp; Express</text>
  </g>

  <g transform="translate(275, 235)" filter="url(#badgeShadow)">
    <rect width="190" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">⚛️ React Native Web</text>
  </g>

  <g transform="translate(480, 235)" filter="url(#badgeShadow)">
    <rect width="155" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">⚡ Expo SDK 57</text>
  </g>

  <g transform="translate(650, 235)" filter="url(#badgeShadow)">
    <rect width="165" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="26" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">🐳 Docker Enabled</text>
  </g>
</svg>