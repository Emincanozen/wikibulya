services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      CORS_ORIGIN: http://localhost:8081
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        EXPO_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
