services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: 5000
      CORS_ORIGIN: "http://localhost:8081"
      DB_URL: "postgres://postgres:YOUR_PASSWORD_HERE@db:5432/wikibulya"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YOUR_PASSWORD_HERE
      POSTGRES_DB: wikibulya
    ports:
      - "127.0.0.1:5432:5432"

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        EXPO_PUBLIC_API_URL: "http://localhost:5000"
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
