version: "3"
services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DB_URL=postgres://user:password@db:5432/wikibulya
    depends_on:
      - db

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wikibulya

  frontend:
    build: ./frontend
    ports:
      - "8081:8081"
